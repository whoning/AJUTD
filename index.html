<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Teko:wght@700&family=Barlow+Condensed:ital,wght@1,800&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

<title>AJ UTD 기록장</title>
<style>
:root{color-scheme:light;--ground:#f3f5f7;--surface:#fff;--border:#e6e6e6;--rule:#eef0f2;--control:#d6d9dd;--text:#1b1d1f;--muted:#5c6064;--accent:#1d5fd6;--accent-soft:#dcf1ff;--accent-ink:#0a3a80;--pos:#2f7a45;--neg:#c41c29;--pos-bg:#dcfae5;--pos-ink:#04250e;--neg-bg:#ffedea;--neg-ink:#831c1e;--neu-bg:#eef1f4;--active:#e6e9ec;--t0:#c2362c;--t0-bg:#ffe5e2;--t0-ink:#8a2a22;--t1:#1d5fd6;--t1-bg:#dcf1ff;--t1-ink:#0a3a80;--r:20px;--rc:10px;--gap:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:16px/1.5 "Manrope",Inter,system-ui,"Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums;word-break:keep-all}
.app{max-width:1152px;margin:0 auto;padding:0 16px 40px}
aside{padding:16px 0 0}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:var(--rc);background:var(--accent);color:#fff;font-size:15px;font-weight:600}
h2{font-size:16px;font-weight:500;margin:0 0 12px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:4px 0 4px}
.sub{margin:0 0 var(--gap);color:var(--muted);min-height:1.5em}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:12px 0 8px}
nav button{border:0;background:none;color:var(--muted);padding:8px 10px;min-height:36px;font-weight:500}
nav button.on{background:var(--active);color:var(--text)}
button,input,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--control);border-radius:var(--rc);padding:8px 12px;min-height:40px}
button{cursor:pointer}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--text);border-color:var(--text);color:#fff}
button.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
nav button.on{background:var(--active);border-color:transparent;color:var(--text)}
button.x{border:0;background:none;color:var(--neg);min-height:0;padding:2px 8px}
.card{background:var(--surface);border-radius:var(--r);padding:20px;margin-bottom:var(--gap)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row>input,.row>select{flex:1;min-width:110px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols select,.cols button{width:100%;margin-bottom:8px}
.cols select{padding:8px 6px}
.score{font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1;text-align:center;margin:8px 0 18px}
.chip{display:inline-block;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:500}
.tt0{background:var(--t0-bg);color:var(--t0-ink)}.tt1{background:var(--t1-bg);color:var(--t1-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:34px;padding:4px 14px;border-radius:999px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{font-size:13px;font-weight:400;color:var(--muted)}
td,th{padding:7px 6px;border-top:1px solid var(--rule);text-align:center}
tr:first-child>th{border-top:0}
td:first-child,th:first-child{text-align:left}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.tile{border-radius:16px;padding:16px}
.tile .big{display:block;font-size:36px;font-weight:600;line-height:1.15;letter-spacing:-.02em;margin:4px 0}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tri table{font-size:14px}.tri td{padding:5px 3px}
.tri td:first-child{color:var(--muted);width:1.6em}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:13px;font-weight:600;margin-right:8px;vertical-align:middle}
.dc{min-height:32px;width:100%;min-width:40px;padding:2px 6px;border:0;border-radius:999px;background:var(--neu-bg);color:var(--muted)}
.dc.ok{background:var(--pos-bg);color:var(--pos-ink)}
.dc.no{background:var(--neg-bg);color:var(--neg-ink)}
.dt{flex:none;width:56px;text-align:center;border-radius:14px;padding:6px 0;background:var(--neu-bg);margin-right:14px;line-height:1.15}
.dt b{display:block;font-size:22px;font-weight:600}.dt span{font-size:12px;color:var(--muted)}
.dt.lg{background:var(--accent-soft)}.dt.lg b,.dt.lg span{color:var(--accent-ink)}
.meter{position:relative;height:8px;border-radius:99px;background:var(--neu-bg);margin-top:10px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:#aab0b8}
.meter i.lg{background:var(--accent)}
.meter u{position:absolute;left:70%;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:2px}
.t0{color:var(--t0)}.t1{color:var(--t1)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.mut{color:var(--muted);font-size:14px}
.auth{margin-top:8px}.auth button{width:100%}
textarea{border-radius:var(--rc)}
.seg{display:inline-flex;gap:4px;background:var(--neu-bg);border-radius:12px;padding:4px;margin-bottom:var(--gap)}
.seg button{border:0;background:none;color:var(--muted);min-height:36px;padding:4px 20px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--text)}
.medal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:600}
.m1{background:#ffe9a8;color:#6b4b00}.m2{background:#e3e7ec;color:#3a3d40}.m3{background:#f6d9c2;color:#6a3a17}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
.two li{flex-wrap:wrap;gap:6px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.live{position:sticky;top:0;z-index:5}
.lv{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:12px;align-items:stretch}
.sb{border-radius:16px;padding:10px;text-align:center}
.live{padding:12px}
.sb b,.clock b{display:block;font-size:44px;font-weight:600;line-height:1.05;letter-spacing:-.03em}
.sb small,.clock small{font-size:14px}
.clock{text-align:center}.clock small{color:var(--muted)}
.clock b{font-size:38px}
.tb{display:flex;gap:6px;justify-content:center;margin-top:6px}.tb button{min-height:44px;padding:4px 14px}
.save{width:100%;min-height:46px;margin-top:8px;font-size:17px;font-weight:600}
.pt{background:var(--ground);border-radius:16px;padding:10px;margin-bottom:8px}
.pn{font-weight:600;font-size:17px;margin-bottom:8px}
.stps{display:flex;gap:10px}
.stp{flex:1;display:flex;align-items:center;justify-content:space-between;gap:4px}
.stp button{width:52px;height:52px;min-height:0;padding:0;font-size:24px;border-radius:14px}
.ogr{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.ogr b{color:var(--text);min-width:1.2em;text-align:center}
.ogr button{width:40px;height:36px;min-height:0;padding:0;border-radius:10px;font-size:18px}
.stp span{text-align:center;line-height:1.1}.stp b{display:block;font-size:26px;font-weight:600}.stp small{font-size:12px;color:var(--muted)}
@media(min-width:900px){
 .app{display:grid;grid-template-columns:232px 1fr;gap:40px;padding:0 24px 56px}
 aside{position:sticky;top:0;align-self:start;padding:32px 0}
 nav{display:flex;flex-direction:column;margin:20px 0 0}
 nav button{text-align:left}
 main{padding-top:32px}
}
/* ── FIFA 스타일 (흰 바탕 + 짙은 남색 카드, 레드·블루 팀 색, 연두 포인트) ── */
:root{--navy:#0b1236;--navy2:#1a2766;--lime:#b8ff3d;--cy:#19e3ff}
body{background:#f3f5fb;font-family:"Pretendard","Noto Sans KR","Manrope",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(10,20,80,.04) 46px 48px);pointer-events:none}
.app{position:relative}
h1,h2{font-family:"Barlow Condensed","Noto Sans KR",sans-serif;font-style:italic;font-weight:800;letter-spacing:.01em}
h1{font-size:32px}
.brand{font-family:"Barlow Condensed","Noto Sans KR",sans-serif;font-style:italic;font-weight:800;text-transform:uppercase}
.mark{background:linear-gradient(135deg,var(--cy),#2b6bff);color:#04123a;border-radius:0;clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%);font-style:italic}
nav button{font-weight:700}
nav button.on{background:var(--lime);color:#0a1a00}
button.pri{background:var(--lime);border-color:var(--lime);color:#0a1a00;font-weight:800}
button.on{background:var(--lime);border-color:var(--lime);color:#0a1a00}
.card{border-radius:14px}
/* 순위: 전광판 + 탭 + 선수 카드 */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;margin-bottom:22px;font-family:"Barlow Condensed","Noto Sans KR",sans-serif;font-style:italic;font-weight:800}
.bt{padding:14px 20px;color:#fff}
.bt.r{background:linear-gradient(120deg,#c3283a,#6a1022);clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%)}
.bt.b{background:linear-gradient(240deg,#1f7bff,#10459e);text-align:right;clip-path:polygon(26px 0,100% 0,100% 100%,0 100%)}
.bt small{display:block;font-size:16px;opacity:.9}
.bt .pts{font-size:56px;line-height:1}.bt .pts span{font-size:18px}
.bt .rec{font-size:14px;opacity:.92}
.vs{display:grid;place-items:center;padding:0 12px;color:#6a77b8;font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:20px}
.tabs{display:flex;gap:8px;margin:0 0 16px;overflow-x:auto}
.tabs button{flex:none;border:0;background:#e3e8f6;color:#3a4685;padding:10px 22px;font-weight:800;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.tabs button.on{background:var(--lime);color:#0a1a00}
.sh{color:#0a5fe0;margin:6px 0 10px;font-size:22px}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pc{container-type:inline-size;position:relative;aspect-ratio:3/4.15;padding:7% 8% 6%;color:#f2f5ff;background:linear-gradient(160deg,var(--navy2),var(--navy));clip-path:polygon(0 0,86% 0,100% 7%,100% 100%,14% 100%,0 93%);display:flex;flex-direction:column;border-bottom:4px solid var(--tc)}
.pc.r{--tc:#ff4d5e}.pc.b{--tc:#3d8bff}
.pc .ovr{position:relative;z-index:1;font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:30cqw;line-height:.95}
.pc .ct{position:relative;z-index:1;font-size:8.5cqw;font-weight:900;color:var(--tc);letter-spacing:.05em}
.pc .cr{position:absolute;z-index:1;right:8cqw;top:7cqw;font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:12cqw;opacity:.75}
.pc .cf{position:absolute;z-index:0;inset:20% 10% 40% 30%;display:grid;place-items:center;container-type:size}
.pc .cf svg{height:100%;max-width:100%}
.pc .cn{position:relative;z-index:1;margin-top:auto;font-weight:900;font-size:12.5cqw;text-align:center;padding:2.5cqw 0;margin-bottom:4cqw;border-top:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.2)}
.pc .cs{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:7.5cqw;color:#8f9bd1}
.pc .cs b{display:block;font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:13cqw;color:#f2f5ff}
.pc.k1{background:linear-gradient(160deg,#fff0b0,#e0aa2c 55%,#9a6a10);color:#2a1a00}
.pc.k2{background:linear-gradient(160deg,#f4f7ff,#b9c3dc 55%,#7a869f);color:#141b30}
.pc.k3{background:linear-gradient(160deg,#ffd9b8,#d08a4e 55%,#8a5424);color:#2a1300}
.pc.k1 .cs,.pc.k2 .cs,.pc.k3 .cs{color:rgba(0,0,0,.6)}.pc.k1 .cs b,.pc.k2 .cs b,.pc.k3 .cs b{color:inherit}
.pc.k1 .cn,.pc.k2 .cn,.pc.k3 .cn{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.2)}
.pc.k1 .ct,.pc.k2 .ct,.pc.k3 .ct{color:inherit;opacity:.8}
@media(max-width:560px){.bt .pts{font-size:40px}.bt{padding:12px 14px}.top3{gap:8px}}
/* 경기 기록: 중계 화면 같은 점수판, 어두운 선수 타일 */
.live{background:transparent;padding:4px 0 10px}
.lv .sb{color:#fff;border-radius:0;font-family:"Barlow Condensed","Noto Sans KR",sans-serif;font-style:italic}
.lv .sb.tt0{background:linear-gradient(120deg,#c3283a,#6a1022);clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%)}
.lv .sb.tt1{background:linear-gradient(240deg,#1f7bff,#10459e);clip-path:polygon(22px 0,100% 0,100% 100%,0 100%)}
.clock{background:var(--navy);color:#fff;border-radius:0;padding:6px 14px;font-family:"Barlow Condensed",sans-serif;font-style:italic}
.clock small{color:var(--cy)}
.save{border-radius:0;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.pt{background:linear-gradient(160deg,var(--navy2),var(--navy));color:#f2f5ff;border-radius:0;border-left:5px solid var(--tc,#3d8bff);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.pt.tc0{--tc:#ff4d5e}.pt.tc1{--tc:#3d8bff}
.pt .stp{background:rgba(7,11,34,.55);border-radius:0}
.pt .stp button{background:#25326f;border:0;color:#f2f5ff;border-radius:0}
.pt .stp:first-child button:last-child{background:var(--lime);color:#0a1a00}
.pt .stp small,.pt .ogr{color:#8f9bd1}.pt .ogr b{color:#f2f5ff}
.pt .ogr button{background:#25326f;border:0;color:#f2f5ff;border-radius:0}
.mm{display:inline-block;width:40px;height:40px;vertical-align:middle;margin-right:8px;background:#0b1236;border-radius:6px}
.mm svg{width:100%;height:100%}
.tb button{background:#25326f;color:#fff;border:0;border-radius:0;font-weight:800}
.tb button:first-child{background:var(--lime);color:#0a1a00}
.tb button.pri{background:var(--lime);color:#0a1a00}
/* ── 잔디 다크 테마 (어두운 잔디 바탕 + 검은 유리 카드 + 라임 포인트) ── */
:root{color-scheme:dark;--ground:#07140b;--surface:rgba(6,14,8,.78);--border:rgba(255,255,255,.1);--rule:rgba(255,255,255,.09);--control:rgba(255,255,255,.18);--text:#eef5ea;--muted:#9fb3a3;--lime:#d4ff3a;--accent:#d4ff3a;--accent-soft:rgba(212,255,58,.16);--accent-ink:#d4ff3a;--pos:#6fe08d;--neg:#ff7480;--pos-bg:rgba(111,224,141,.2);--pos-ink:#8df0a8;--neg-bg:rgba(255,116,128,.2);--neg-ink:#ff9aa3;--neu-bg:rgba(255,255,255,.08);--active:rgba(255,255,255,.1);--t0:#ff6170;--t0-bg:rgba(255,77,94,.2);--t0-ink:#ff9aa3;--t1:#5c9dff;--t1-bg:rgba(61,139,255,.22);--t1-ink:#9cc3ff;--navy:#070b08;--navy2:#1b261d;--cy:#d4ff3a}
body{background:#07140b}
body::before{background:radial-gradient(90% 55% at 15% 0,rgba(96,170,60,.55),transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 70px,transparent 70px 140px),linear-gradient(#17451c,#061008 75%)}
.card{border:1px solid var(--border)}
h1,.brand{font-family:inherit;font-style:normal}
h2{font-family:inherit;font-style:normal;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.sh{font-family:"Teko",sans-serif;font-size:26px;line-height:1;letter-spacing:.04em;color:var(--lime)}
.mark{background:var(--lime);color:#0a1a00}
.seg button.on{background:var(--lime);color:#0a1a00}
.tabs button{background:var(--neu-bg);color:var(--text)}
.vs,.pc .cs,.pt .stp small,.pt .ogr{color:var(--muted)}
.pc:not(.k1,.k2,.k3) .ovr{color:var(--lime)}
.pt .stp button,.pt .ogr button,.tb button{background:rgba(255,255,255,.12)}
.mm{background:rgba(255,255,255,.08)}
.live{background:rgba(6,14,8,.92);padding:8px}
@media(max-width:899px){
 .app{padding-bottom:96px}
 nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:9;display:flex;margin:0;padding:6px;border-radius:18px;background:rgba(6,14,8,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--border)}
 nav button{flex:1;padding:8px 2px;min-height:44px;font-size:13px;white-space:nowrap}
}
/* 라인업: 큰 숫자를 뒤에 깐 선수 타일 + 선택한 선수 상세 */
.lu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lt{position:relative;overflow:hidden;min-height:0;padding:0 0 8px;border:1px solid var(--rule);border-radius:14px;background:rgba(255,255,255,.06);font-weight:700;text-align:center}
.lt.sel{border-color:var(--lime);box-shadow:0 0 15px rgba(212,255,58,.35)}
.lt i,.lh i{position:absolute;right:6px;top:0;font:700 46px/1 "Teko",sans-serif;color:rgba(255,255,255,.16)}
.lt svg{position:relative;display:block;width:64%;margin-left:2%}
.lt span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.lh{position:relative;overflow:hidden;height:190px;margin:-20px -20px 14px;border-radius:14px 14px 0 0;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border-bottom:3px solid var(--t0)}
.lh.b{border-color:var(--t1)}
.lh i{right:14px;top:10px;font-size:190px}
.lh svg{position:relative;height:100%}
.ln{font-size:26px;font-weight:800;line-height:1.2}
.sxs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sx{border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.06);color:var(--muted);font-size:13px}
.sx b{display:block;font:700 44px/1 "Teko",sans-serif;color:var(--lime)}
.ltab{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border-top:1px solid var(--rule)}
.ltab button{border:0;border-radius:0;background:none;color:var(--muted);font-weight:700;min-height:48px;border-top:2px solid transparent;margin-top:-1px}
.ltab .sel.t0{color:var(--t0);border-color:var(--t0)}.ltab .sel.t1{color:var(--t1);border-color:var(--t1)}
</style>
</head>
<body>
<div class="app"><aside>
<div class="brand"><span class="mark">AJ</span>UTD 기록장</div>
<div class="row"><select id="ss" data-sel="s"></select><button data-a="newse">새 시즌</button></div>
<nav id="nav"></nav><div id="auth" class="auth"></div><div id="st" class="mut"></div></aside>
<main id="v"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>

    q=rev?q.eq('data->>rev',String(rev)):q.or('data->>rev.is.null,data->>rev.eq.0');
    const {data,error}=await q.select('id');
    if(error){setNet('저장 실패: '+error.message);return}
    if(!data.length){alert('다른 운영자가 먼저 저장했어요. 최신 기록을 불러옵니다.');await loadRemote();return}

  setNet('저장됨')}

// 시즌 누적 = 엑셀에서 가져온 base + 앱에 기록한 라운드
function calc(s){
  const T=s.base.rec.map(r=>({...r})),P={},g=id=>P[id]??={g:0,a:0,t:0};
  for(const [id,v] of Object.entries(s.base.p))Object.assign(g(id),v);
  let R=s.base.rounds;
  s.rounds.forEach(r=>{R++;r.att.forEach(id=>g(id).t++);
    r.games.forEach(m=>{const [a,b]=score(m);
      if(a>b){T[0].w++;T[1].l++}else if(a<b){T[1].w++;T[0].l++}else{T[0].d++;T[1].d++}
      m.forEach(x=>{if(x.p)g(x.p).g++;if(x.a)g(x.a).a++;if(x.og)g(x.og).o=(g(x.og).o||0)+1})})});
  return {T,P,R}}

function ini(c){const k=c.charCodeAt(0)-0xAC00;if(k<0||k>11171)return c.toUpperCase();
  const I=Math.floor(k/588),V=Math.floor(k%588/28);
  const L=['K','K','N','D','D','R','M','B','B','S','S','','J','J','C','K','T','P','H'][I];
  if(L)return L;return [2,3,6,7,12,17].includes(V)?'Y':[9,10,13,14,15,16].includes(V)?'W':V===0?'A':V===8||V===11?'O':V===20?'I':V===19?'U':'E'}
const iniOf=id=>{const p=pl(id);return (p?.ini||ini((p?.name||'?')[0])).toUpperCase()};
// Varsity 스타일 이니셜(Teko): 팀 색 채움 + 흰 외곽선 + 약한 그림자. 모든 카드가 같은 크기·기준선·중심
function mono(id,t){const c=t?'#1b46b8':'#d9202f';
  return `<svg viewBox="0 0 100 100" style="overflow:visible"><g class="mg" transform="translate(46 75) scale(1.12 1) skewX(-9)"><text x="0" y="0" text-anchor="middle" font-family="Teko,'Barlow Condensed',sans-serif" font-weight="700" font-size="88" fill="${c}" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" style="filter:drop-shadow(1.5px 2.5px 1px rgba(0,0,0,.4))">${esc(iniOf(id))}</text></g></svg>`}
function fit(){document.querySelectorAll('.mg').forEach(g=>{const WX=1.12,w=g.firstElementChild.getBBox().width*WX,s=Math.min(1,44/(w||1));
  g.setAttribute('transform',`translate(46 75) scale(${s*WX} ${s}) skewX(-9)`)})}

let rkKey='o';
const rated=s=>{const {T,P,R}=calc(s);
  const ids=[...new Set([...s.teams.flatMap(t=>t.ids),...Object.keys(P)])].filter(id=>pl(id)&&!pl(id).guest&&!pl(id).name.includes('용병'));
  // 카드 왼쪽 위 숫자 = 100점 만점: 골 40(시즌 최다 대비) + 어시 30(시즌 최다 대비) + 출석 30(출석한 라운드 ÷ 전체)
  const MG=Math.max(1,...ids.map(id=>P[id]?.g||0)),MA=Math.max(1,...ids.map(id=>P[id]?.a||0));
  const rows=ids.map(id=>{const x=P[id]||{g:0,a:0,t:0};return {id,g:x.g,a:x.a,t:x.t,team:Math.max(0,teamOf(s,id)),o:Math.round(40*x.g/MG+30*x.a/MA+30*(R?x.t/R:0))}});
  return {T,P,R,ids,rows}};

      ${s?`<select data-tm="${p.id}"><option value="">팀 없음</option>${s.teams.map((t,i)=>`<option value="${i}" ${teamOf(s,p.id)===i?'selected':''}>${esc(t.n)}</option>`).join('')}</select>`:''}
      <button data-a="mem" data-i="${p.id}" class="${p.m?'on':''}">참여</button><button class="x" data-a="delp" data-i="${p.id}">삭제</button></span></li>`;
  const real=S.players.filter(p=>!p.guest&&!p.name.includes('용병')),on=real.filter(p=>p.m),off=real.filter(p=>!p.m);  // 용병은 명단에 표시하지 않음
  return `<div class="card"><h2>선수 추가</h2>
    <div class="row"><input id="pn" placeholder="이름"><label><input id="pm" type="checkbox" checked style="min-height:0"> 참여 중 (회비 대상)</label><button class="pri" data-a="addp">추가</button></div>
    ${s?'<div class="mut">팀은 선택한 시즌 기준입니다.</div>':''}</div>
  <div class="two"><div class="card"><h2>참여 중 (${on.length}명)</h2><ul>${on.map(li).join('')}</ul></div>
  <div class="card"><h2>미참여 (${off.length}명) · 팀은 그대로, 회비 대상에서만 빠져요</h2><ul>${off.map(li).join('')}</ul></div></div>
  <div class="card"><h2>이름 한꺼번에 바꾸기 · 한 줄에 "지금이름 새이름"</h2>
    <textarea id="rn" rows="4" placeholder="영운 이영운" style="width:100%;font:inherit;padding:8px"></textarea>
    <button class="pri" data-a="rename" style="margin-top:8px">이름 바꾸기</button></div>
  <div class="card"><h2>백업 (브라우저를 바꾸거나 지우면 기록이 사라져요)</h2>
    <div class="row"><button data-a="exp">내보내기</button><input id="imp" type="file" accept=".json"></div></div>`}

function vLogin(){if(OP)return '<div class="card">운영자로 로그인되어 있어요.</div>';
  return `<div class="card"><div class="row"><input id="le" type="email" autocomplete="username" placeholder="이메일"></div>
    <div class="row"><input id="lp" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
    <button class="pri" data-a="dologin">로그인</button><div class="neg" style="margin-top:8px">${esc(loginErr)}</div></div>`}
function render(){
  if(sb&&tab==='o'&&!OP)tab='c';
  $('#ss').innerHTML=S.seasons.map(s=>`<option value="${s.id}" ${s.id===S.sid?'selected':''}>${esc(s.name)}</option>`).join('')||'<option>시즌 없음</option>';
  $('#nav').innerHTML=[['g','경기 기록'],['c','일정'],['u','라인업'],['r','순위'],...(OP?[['o','운영자']]:[])].map(([k,t])=>`<button class="${tab===k?'on':''}" data-a="tab" data-i="${k}">${t}</button>`).join('');
  const na=document.querySelector('[data-a=newse]');if(na)na.hidden=!OP;
  $('#auth').innerHTML=sb?(OP?'<button data-a="dologout">로그아웃</button>':'<button data-a="tab" data-i="l">운영자 로그인</button>'):'';
  const st=$('#st');if(st)st.textContent=net;
  const T={g:'경기 기록',c:'일정',u:'라인업',r:'순위',o:'운영자',l:'운영자 로그인'};
  const nx=SCHED.filter(([d])=>d>=today()).sort()[0],late=S.players.filter(p=>p.m&&unpaidOf(p.id).length).length;
  const sub={c:nx?`다음 경기 ${nx[0].slice(5).replace('-','/')} · 투표 ${nx[1]}명 · ${guide(nx[1])[1]}`:'',
    o:opsTab==='d'?(late?`회비 미입금 ${late}명 · 월 ${DUE.toLocaleString()}원`:'회비 미입금 없음'):''}[tab]||'';
  $('#v').innerHTML=`<h1>${T[tab]}</h1><p class="sub">${esc(sub)}</p>`+{g:vGame,c:vSched,u:vLine,r:vRank,o:vOps,l:vLogin}[tab]();
  fit();
}
render();loadRemote();document.fonts.ready.then(fit);
</script>
</body>
</html>
